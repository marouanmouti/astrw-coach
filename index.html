<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ASTRW">
<meta name="theme-color" content="#1a4fa0">
<title>ASTRW Coach App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
:root{
  --blue:#1a4fa0;--blue-mid:#2d67c8;--blue-light:#e8f0fb;--blue-dark:#0d2d5e;
  --white:#fff;--gray:#f5f6fa;--border:#dde3f0;--text:#1a1a2e;--muted:#6b7280;
  --green:#2e7d32;--green-bg:#e8f5e9;--orange:#e65100;--orange-bg:#fff3e0;--red:#c62828;--red-bg:#fce4ec;
}
html,body{height:100%;overflow:hidden;background:#f0f2f8;}
#app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#f0f2f8;overflow:hidden;}
.top-bar{background:var(--blue);padding:env(safe-area-inset-top,0) 0 0;flex-shrink:0;z-index:10;}
.top-bar-inner{padding:12px 16px 11px;display:flex;align-items:center;gap:10px;}
.badge-club{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9px;color:var(--blue);line-height:1.2;text-align:center;flex-shrink:0;}
.top-title{flex:1;}
.top-title h1{font-size:15px;font-weight:600;color:#fff;}
.top-title p{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px;}
.season-tag{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 10px;font-size:10px;color:#fff;font-weight:500;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{display:none;}
.page{display:none;padding:14px;}
.page.active{display:block;}
.nav{background:#fff;border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:9px;font-weight:500;-webkit-tap-highlight-color:transparent;min-height:52px;justify-content:center;}
.nav-icon{font-size:20px;line-height:1;display:block;}
.nav-btn.active{color:var(--blue);}
.sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:0 0 8px;}
.card{background:#fff;border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-box{background:#fff;border-radius:12px;border:1px solid var(--border);padding:12px;text-align:center;}
.stat-val{font-size:26px;font-weight:600;color:var(--blue-dark);}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500;}
.next-card{background:var(--blue);border-radius:14px;padding:16px;margin-bottom:10px;color:#fff;}
.next-label{font-size:10px;color:rgba(255,255,255,.65);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.next-opp{font-size:20px;font-weight:600;margin:5px 0 4px;}
.next-meta{font-size:12px;color:rgba(255,255,255,.8);margin-top:3px;}
.alerts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.alert-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:500;}
.ap-red{background:var(--red-bg);color:var(--red);}
.ap-orange{background:var(--orange-bg);color:var(--orange);}
.ap-blue{background:var(--blue-light);color:var(--blue);}
.match-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f8;}
.match-row:last-child{border-bottom:none;}
.res-badge{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.rv{background:var(--green-bg);color:var(--green);}
.rn{background:var(--orange-bg);color:var(--orange);}
.rd{background:var(--red-bg);color:var(--red);}
.player-info{flex:1;min-width:0;}
.player-name{font-size:13px;font-weight:500;color:var(--text);}
.player-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.match-score{font-size:14px;font-weight:600;color:var(--blue-dark);}
.player-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f2f8;}
.player-row:last-child{border-bottom:none;}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}
.rank-num{font-size:13px;font-weight:600;color:var(--blue);width:18px;text-align:right;flex-shrink:0;}
.rank-val{font-size:13px;font-weight:600;color:#fff;background:var(--blue);border-radius:7px;padding:3px 9px;min-width:30px;text-align:center;flex-shrink:0;}
.tag{border-radius:7px;padding:3px 9px;font-size:10px;font-weight:600;}
.tag-ok{background:var(--green-bg);color:var(--green);}
.tag-bless{background:var(--orange-bg);color:var(--orange);}
.tag-susp{background:var(--red-bg);color:var(--red);}
.form-group{margin-bottom:11px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);background:#fff;outline:none;appearance:none;-webkit-appearance:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);}
.form-group textarea{resize:none;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;}
.btn:active{opacity:.85;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-secondary{background:var(--blue-light);color:var(--blue);margin-top:8px;}
.btn-sm{width:auto;padding:5px 10px;font-size:11px;border-radius:7px;margin-top:0;}
.tab-pills{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.tab-pills::-webkit-scrollbar{display:none;}
.pill{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.sub-page{display:none;}
.sub-page.active{display:block;}
.convo-box{background:var(--blue-light);border-radius:12px;padding:14px;font-size:12.5px;color:var(--blue-dark);line-height:1.75;white-space:pre-wrap;margin-top:12px;border:1px dashed var(--blue-mid);}
.player-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.pcheck{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:12px;color:var(--text);-webkit-tap-highlight-color:transparent;}
.pcheck.sel{border-color:var(--blue);background:var(--blue-light);color:var(--blue);font-weight:500;}
.pcheck-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
.pcheck.sel .pcheck-dot{background:var(--blue);border-color:var(--blue);}
.prog-bar{height:6px;background:#f0f2f8;border-radius:3px;margin-top:5px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:var(--blue);}
.prog-fill.warn{background:var(--orange);}
.prog-fill.danger{background:var(--red);}
.cal-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f8;}
.cal-row:last-child{border-bottom:none;}
.cal-date{text-align:center;min-width:32px;}
.cal-day{font-size:17px;font-weight:600;color:var(--blue-dark);line-height:1;}
.cal-month{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:600;}
.cal-info{flex:1;}
.cal-opp{font-size:13px;font-weight:500;color:var(--text);}
.cal-meta{font-size:10px;color:var(--muted);margin-top:1px;}
.cal-res{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap;}
.cr-v{background:var(--green-bg);color:var(--green);}
.cr-n{background:var(--orange-bg);color:var(--orange);}
.cr-d{background:var(--red-bg);color:var(--red);}
.cr-a{background:var(--blue-light);color:var(--blue);}
.empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:13px;}
.note-card{background:#fffef0;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin-bottom:8px;}
.note-date{font-size:10px;color:var(--muted);margin-bottom:4px;}
.note-text{font-size:13px;color:var(--text);line-height:1.5;}
.score-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.score-team{flex:1;text-align:center;}
.score-team-name{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.score-num{display:flex;align-items:center;gap:6px;justify-content:center;}
.score-num button{width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:18px;cursor:pointer;color:var(--blue);font-weight:600;display:flex;align-items:center;justify-content:center;}
.score-num span{font-size:28px;font-weight:700;color:var(--blue-dark);min-width:32px;text-align:center;}
.score-sep{font-size:20px;font-weight:700;color:var(--muted);}
.but-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#f8f9fc;border-radius:10px;padding:10px;}
.but-row select{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);outline:none;}
.but-num{display:flex;align-items:center;gap:4px;}
.but-num button{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:14px;color:var(--blue);}
.but-num span{font-size:14px;font-weight:600;color:var(--text);min-width:16px;text-align:center;}
.del-btn{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px;}
.carton-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.ctag{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ctag-j{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange);}
.ctag-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red);}
.ctag-off{background:#f0f2f8;color:var(--muted);border:1px solid var(--border);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a2e;color:#fff;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="top-bar-inner">
      <div class="badge-club">ASTRW</div>
      <div class="top-title"><h1>Coach App</h1><p>R3 Alsace · Assistant entraîneur</p></div>
      <div class="season-tag">2025/26</div>
    </div>
  </div>

  <div class="content" id="content">

    <div class="page active" id="page-home">
      <div id="home-next"></div>
      <div class="stat-grid" id="home-stats"></div>
      <div class="sec">Alertes</div>
      <div id="home-alerts" class="alerts" style="margin-bottom:10px"></div>
      <div class="sec">Derniers résultats</div>
      <div class="card" id="home-results"></div>
    </div>

    <div class="page" id="page-convo">
      <div class="sec">Infos du match</div>
      <div class="card">
        <div class="form-group"><label>Adversaire</label><input type="text" id="c-adv" placeholder="FC Mulhouse B"></div>
        <div class="form-row">
          <div class="form-group"><label>Date</label><input type="date" id="c-date"></div>
          <div class="form-group"><label>RDV</label><input type="time" id="c-time" value="13:30"></div>
        </div>
        <div class="form-group"><label>Lieu</label><input type="text" id="c-lieu" placeholder="Stade Théodore"></div>
        <div class="form-group"><label>Type</label><select id="c-type"><option>Domicile</option><option>Extérieur</option></select></div>
        <div class="form-group"><label>Message optionnel</label><textarea id="c-msg" rows="2" placeholder="Tenue complète requise..."></textarea></div>
      </div>
      <div class="sec">Joueurs convoqués</div>
      <div class="player-checks" id="convo-checks"></div>
      <button class="btn btn-primary" id="btn-gen-convo">📋 Générer la convocation</button>
      <div id="convo-result" style="display:none">
        <div class="convo-box" id="convo-text"></div>
        <button class="btn btn-secondary" id="btn-copy-convo">📲 Copier pour WhatsApp</button>
      </div>
    </div>

    <div class="page" id="page-stats">
      <div class="tab-pills" id="stats-pills">
        <div class="pill active" data-sub="sub-buteurs">⚽ Buteurs</div>
        <div class="pill" data-sub="sub-passeurs">🎯 Passeurs</div>
        <div class="pill" data-sub="sub-minutes">⏱ Minutes</div>
        <div class="pill" data-sub="sub-saisir">➕ Saisir</div>
      </div>
      <div class="sub-page active" id="sub-buteurs"></div>
      <div class="sub-page" id="sub-passeurs"></div>
      <div class="sub-page" id="sub-minutes"></div>
      <div class="sub-page" id="sub-saisir"></div>
    </div>

    <div class="page" id="page-effectif">
      <div class="tab-pills" id="eff-pills">
        <div class="pill active" data-sub="sub-liste">👥 Liste</div>
        <div class="pill" data-sub="sub-cartons">🟨 Cartons</div>
        <div class="pill" data-sub="sub-ajouter">➕ Ajouter</div>
      </div>
      <div class="sub-page active" id="sub-liste"></div>
      <div class="sub-page" id="sub-cartons"></div>
      <div class="sub-page" id="sub-ajouter">
        <div class="card">
          <div class="form-group"><label>Nom complet</label><input type="text" id="new-nom" placeholder="Lucas Bernard"></div>
          <div class="form-row">
            <div class="form-group"><label>Numéro</label><input type="number" id="new-num" min="1" max="99" placeholder="10"></div>
            <div class="form-group"><label>Poste</label><select id="new-poste"><option>Gardien</option><option>Défenseur</option><option>Milieu</option><option>Ailier</option><option>Attaquant</option></select></div>
          </div>
          <div class="form-group"><label>Statut</label><select id="new-statut"><option value="ok">Disponible</option><option value="bless">Blessé</option><option value="susp">Suspendu</option></select></div>
          <button class="btn btn-primary" id="btn-add-player">Ajouter le joueur</button>
        </div>
      </div>
    </div>

    <div class="page" id="page-cal">
      <div class="tab-pills" id="cal-pills">
        <div class="pill active" data-sub="sub-cal-liste">📅 Matchs</div>
        <div class="pill" data-sub="sub-cal-ajouter">➕ Ajouter</div>
      </div>
      <div class="sub-page active" id="sub-cal-liste"></div>
      <div class="sub-page" id="sub-cal-ajouter">
        <div class="card">
          <div class="form-group"><label>Adversaire</label><input type="text" id="cal-adv" placeholder="FC Mulhouse B"></div>
          <div class="form-row">
            <div class="form-group"><label>Date</label><input type="date" id="cal-date"></div>
            <div class="form-group"><label>Heure</label><input type="time" id="cal-heure" value="15:00"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Type</label><select id="cal-type"><option>Domicile</option><option>Extérieur</option></select></div>
            <div class="form-group"><label>Lieu</label><input type="text" id="cal-lieu" placeholder="Stade Théodore"></div>
          </div>
          <button class="btn btn-primary" id="btn-add-match">Ajouter au calendrier</button>
        </div>
      </div>
    </div>

    <div class="page" id="page-notes">
      <div class="card">
        <div class="form-group"><textarea id="note-input" rows="4" placeholder="Observations tactiques, points à travailler..."></textarea></div>
        <button class="btn btn-primary" id="btn-add-note">Enregistrer la note</button>
      </div>
      <div class="sec" style="margin-top:4px">Notes récentes</div>
      <div id="notes-list"></div>
    </div>

  </div>

  <nav class="nav">
    <button class="nav-btn active" data-page="home"><span class="nav-icon">🏠</span>Dashboard</button>
    <button class="nav-btn" data-page="convo"><span class="nav-icon">📋</span>Convo</button>
    <button class="nav-btn" data-page="stats"><span class="nav-icon">📊</span>Stats</button>
    <button class="nav-btn" data-page="effectif"><span class="nav-icon">👥</span>Effectif</button>
    <button class="nav-btn" data-page="cal"><span class="nav-icon">📅</span>Calendrier</button>
    <button class="nav-btn" data-page="notes"><span class="nav-icon">📝</span>Notes</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

function initials(nom){var p=nom.split(' ');return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function fmtDate(d){if(!d)return'';var p=d.split('-');var M=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];return parseInt(p[2])+' '+M[parseInt(p[1])-1]+' '+p[0];}
function fmtShort(d){if(!d)return'';var p=d.split('-');var M=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];return parseInt(p[2])+' '+M[parseInt(p[1])-1];}
function getPlayer(id){for(var i=0;i<players.length;i++){if(players[i].id==id)return players[i];}return null;}

/* ---- NAVIGATION PRINCIPALE ---- */
function goPage(name){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var pg=document.getElementById('page-'+name);
  if(pg)pg.classList.add('active');
  var btn=document.querySelector('.nav-btn[data-page="'+name+'"]');
  if(btn)btn.classList.add('active');
  document.getElementById('content').scrollTop=0;
  if(name==='home')renderHome();
  else if(name==='convo')renderConvo();
  else if(name==='stats'){renderButeurs();renderPasseurs();renderMinutes();renderSaisir();}
  else if(name==='effectif'){renderListe();renderCartons();}
  else if(name==='cal')renderCalListe();
  else if(name==='notes')renderNotes();
}

/* ---- NAVIGATION SOUS-ONGLETS ---- */
function initPills(pillsId){
  var container=document.getElementById(pillsId);
  if(!container)return;
  var pills=container.querySelectorAll('.pill');
  pills.forEach(function(pill){
    pill.addEventListener('click',function(){
      pills.forEach(function(p){p.classList.remove('active');});
      pill.classList.add('active');
      var subId=pill.getAttribute('data-sub');
      var page=pill.closest('.page');
      page.querySelectorAll('.sub-page').forEach(function(s){s.classList.remove('active');});
      var sub=document.getElementById(subId);
      if(sub)sub.classList.add('active');
    });
  });
}

    '<div class="stat-box"><div class="stat-val">'+(v*3+n)+'</div><div class="stat-lbl">Points</div></div>'+

function renderConvo(){
  var html='';
  var sorted=[].concat(players).sort(function(a,b){return a.num-b.num;});
  sorted.forEach(function(p){
    var isBless=p.statut==='bless';
    html+='<div class="pcheck'+(isBless?'':' sel')+'" data-id="'+p.id+'">'+
      '<div class="pcheck-dot"></div><span>#'+p.num+' '+p.nom.split(' ')[0]+'</span></div>';
  });
  document.getElementById('convo-checks').innerHTML=html;
  document.getElementById('convo-result').style.display='none';
  document.querySelectorAll('#convo-checks .pcheck').forEach(function(el){
    el.addEventListener('click',function(){el.classList.toggle('sel');});
  });

function genConvo(){
  var adv=document.getElementById('c-adv').value||'Adversaire';
  var date=document.getElementById('c-date').value;
  var time=document.getElementById('c-time').value;
  var lieu=document.getElementById('c-lieu').value||'Stade Théodore';
  var type=document.getElementById('c-type').value;
  var msg=document.getElementById('c-msg').value;
  var sel=document.querySelectorAll('#convo-checks .pcheck.sel');
  var convoked=[];
  sel.forEach(function(el,i){
    var p=getPlayer(parseInt(el.getAttribute('data-id')));
    if(p)convoked.push((i+1)+'. '+p.nom+' (#'+p.num+')');
  });
  var txt='📢 *CONVOCATION ASTRW*\n';
  txt+='────────────────────\n';
  txt+='⚽ *Match :* ASTRW vs '+adv+'\n';
  txt+='📅 *Date :* '+fmtDate(date)+'\n';
  txt+='⏰ *RDV :* '+time+'\n';
  txt+='📍 *Lieu :* '+lieu+' ('+type+')\n';
  txt+='────────────────────\n';
  txt+='*Joueurs convoqués ('+convoked.length+') :*\n';
  txt+=convoked.join('\n');
  txt+='\n────────────────────\n';
  if(msg)txt+=msg+'\n';
  txt+='✅ Merci de confirmer votre présence.\nBonne préparation ! 💙🤍\n— Staff ASTRW';
  document.getElementById('convo-text').textContent=txt;
  document.getElementById('convo-result').style.display='block';
  document.getElementById('convo-result').scrollIntoView({behavior:'smooth'});
}

function copyConvo(){
  var t=document.getElementById('convo-text').textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('✅ Copié !');}).catch(function(){fallbackCopy(t);});
  } else {fallbackCopy(t);}
}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('✅ Copié !');}catch(e){toast('Copie manuelle nécessaire');}document.body.removeChild(ta);}

      '<div class="av" style="background:'+avColor(p.id)+'">'+initials(p.nom)+'</div>'+

    '<div class="form-group"><label>Adversaire</label><input type="text" id="s-adv" placeholder="FC Mulhouse B"></div>'+
    '<div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="s-date"></div><div class="form-group"><label>Type</label><select id="s-type"><option>Domicile</option><option>Extérieur</option></select></div></div>'+

    '<div class="score-sep">–</div>'+
    '<div class="score-team"><div class="score-team-name">Adverse</div><div class="score-num"><button id="sm1">−</button><span id="sn1">0</span><button id="sp1">+</button></div></div></div></div>'+
    '<div class="form-group"><label>Buteurs</label><div id="s-buts-list"></div><button class="btn btn-secondary" id="btn-add-but" style="margin-top:6px">+ Buteur</button></div>'+
    '<div class="form-group"><label>Passeurs</label><div id="s-passes-list"></div><button class="btn btn-secondary" id="btn-add-passe" style="margin-top:6px">+ Passeur</button></div>'+
    '<div class="form-group"><label>Cartons jaunes</label><div class="carton-grid" id="s-jaunes">'+cj+'</div></div>'+
    '<div class="form-group"><label>Carton rouge</label><div class="carton-grid" id="s-rouges">'+cr+'</div></div>'+
    '<button class="btn btn-primary" id="btn-save-match">Enregistrer le match</button></div>';
  document.getElementById('sub-saisir').innerHTML=h;

  document.getElementById('sm0').addEventListener('click',function(){sScore[0]=Math.max(0,sScore[0]-1);document.getElementById('sn0').textContent=sScore[0];});
  document.getElementById('sp0').addEventListener('click',function(){sScore[0]++;document.getElementById('sn0').textContent=sScore[0];});
  document.getElementById('sm1').addEventListener('click',function(){sScore[1]=Math.max(0,sScore[1]-1);document.getElementById('sn1').textContent=sScore[1];});
  document.getElementById('sp1').addEventListener('click',function(){sScore[1]++;document.getElementById('sn1').textContent=sScore[1];});
  document.getElementById('btn-add-but').addEventListener('click',function(){addButRow('s-buts-list',opts);});
  document.getElementById('btn-add-passe').addEventListener('click',function(){addButRow('s-passes-list',opts);});
  document.getElementById('btn-save-match').addEventListener('click',saveMatch);

    el.addEventListener('click',function(){
      el.classList.toggle('ctag-off');el.classList.toggle('ctag-j');

      var idx=sJaunes.indexOf(pid);

  });

      var idx=sRouges.indexOf(pid);
      if(idx>=0)sRouges.splice(idx,1);else sRouges.push(pid);
    });

function addButRow(listId,opts){
  var list=document.getElementById(listId);
  var row=document.createElement('div');row.className='but-row';
  row.innerHTML='<select>'+opts+'</select><div class="but-num"><button class="bm">−</button><span>1</span><button class="bp">+</button></div><button class="del-btn">✕</button>';
  list.appendChild(row);
  row.querySelector('.bm').addEventListener('click',function(){var s=row.querySelector('.but-num span');s.textContent=Math.max(1,parseInt(s.textContent)-1);});
  row.querySelector('.bp').addEventListener('click',function(){var s=row.querySelector('.but-num span');s.textContent=parseInt(s.textContent)+1;});
  row.querySelector('.del-btn').addEventListener('click',function(){row.remove();});
}

function saveMatch(){
  var adv=document.getElementById('s-adv').value;
  var date=document.getElementById('s-date').value;
  var type=document.getElementById('s-type').value;
  if(!adv||!date){toast('⚠️ Remplis adversaire et date');return;}
  var buts=[],passes=[];
  document.querySelectorAll('#s-buts-list .but-row').forEach(function(r){
    buts.push({pid:parseInt(r.querySelector('select').value),nb:parseInt(r.querySelector('.but-num span').textContent)});
  });
  document.querySelectorAll('#s-passes-list .but-row').forEach(function(r){
    passes.push({pid:parseInt(r.querySelector('select').value),nb:parseInt(r.querySelector('.but-num span').textContent)});
  });
  matchs.push({id:Date.now(),adv:adv,date:date,heure:'15:00',type:type,lieu:'',scoreNous:sScore[0],scoreAdv:sScore[1],statut:'joue',buts:buts,passes:passes,jaunes:sJaunes.map(function(id){return{pid:id};}),rouges:sRouges.map(function(id){return{pid:id};})});
  buts.forEach(function(b){var p=getPlayer(b.pid);if(p){p.buts+=b.nb;p.minutes+=90;}});
  passes.forEach(function(b){var p=getPlayer(b.pid);if(p)p.passes+=b.nb;});
  sJaunes.forEach(function(id){var p=getPlayer(id);if(p){p.jaunes++;if(p.jaunes>=3)p.statut='susp';}});
  sRouges.forEach(function(id){var p=getPlayer(id);if(p){p.rouges++;p.statut='susp';}});
  save('astrw_players',players);save('astrw_matchs',matchs);
  toast('✅ Match enregistré !');renderSaisir();
}

/* ---- EFFECTIF ---- */
function renderListe(){
  var sorted=[].concat(players).sort(function(a,b){return a.num-b.num;});
  var tagC={ok:'tag-ok',bless:'tag-bless',susp:'tag-susp'};
  var tagT={ok:'Disponible',bless:'Blessé',susp:'Suspendu'};
  var h='<div class="card">';
  sorted.forEach(function(p){
    var tc=tagC[p.statut]||'tag-ok';var tt=tagT[p.statut]||'Disponible';
    h+='<div class="player-row">'+
      '<div class="av" style="background:'+avColor(p.id)+'">'+initials(p.nom)+'</div>'+
      '<div class="player-info"><div class="player-name">'+p.nom+'</div><div class="player-sub">#'+p.num+' · '+p.poste+' · '+p.buts+' ⚽ '+p.passes+' 🎯</div></div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+
        '<div class="tag '+tc+'">'+tt+'</div>'+
        '<div style="display:flex;gap:4px">'+
          '<button class="btn btn-sm btn-secondary" style="padding:4px 8px;font-size:10px" data-statut="'+p.id+'">Statut</button>'+
          '<button class="btn btn-sm" style="padding:4px 8px;font-size:10px;background:var(--red-bg);color:var(--red);margin-top:0" data-del="'+p.id+'">✕</button>'+
        '</div>'+
      '</div></div>';
  });
  h+='</div>';
  document.getElementById('sub-liste').innerHTML=h;
  document.querySelectorAll('[data-statut]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pid=parseInt(btn.getAttribute('data-statut'));
      var p=getPlayer(pid);if(!p)return;
      var s=['ok','bless','susp'];var idx=s.indexOf(p.statut);
      p.statut=s[(idx+1)%s.length];
      save('astrw_players',players);renderListe();toast('Statut mis à jour');
    });
  });
  document.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pid=parseInt(btn.getAttribute('data-del'));
      if(!confirm('Supprimer ce joueur ?'))return;
      players=players.filter(function(p){return p.id!==pid;});
      save('astrw_players',players);renderListe();toast('Joueur supprimé');
    });
  });
}

function renderCartons(){
  var sorted=[].concat(players).sort(function(a,b){return b.jaunes-a.jaunes;});

  sorted.forEach(function(p){

        '<div class="prog-bar"><div class="prog-fill '+cls+'" style="width:'+pct+'%"></div></div>'+
      '</div></div>';
  });
  h+='</div>';
  document.getElementById('sub-cartons').innerHTML=h;
}

  var sorted=[].concat(notes).sort(function(a,b){return a.date<b.date?1:-1;});
  var h='';
  if(!sorted.length)h='<div class="empty">Aucune note pour l\'instant</div>';
  sorted.forEach(function(n){
    h+='<div class="note-card"><div class="note-date">📅 '+fmtDate(n.date)+'<button style="float:right;background:none;border:none;color:var(--red);cursor:pointer;font-size:14px" data-del-note="'+n.id+'">✕</button></div>'+
      '<div class="note-text">'+n.texte+'</div></div>';
  });
  document.getElementById('notes-list').innerHTML=h;
  document.querySelectorAll('[data-del-note]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=parseInt(btn.getAttribute('data-del-note'));
      notes=notes.filter(function(n){return n.id!==id;});
      save('astrw_notes',notes);renderNotes();
    });
  });
}

/* ---- INIT ---- */
function init(){
  /* Nav principale */
  document.querySelectorAll('.nav-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      goPage(btn.getAttribute('data-page'));
    });
  });
  /* Sous-onglets */
  initPills('stats-pills');
  initPills('eff-pills');
  initPills('cal-pills');
  /* Boutons fixes */
  document.getElementById('btn-gen-convo').addEventListener('click',genConvo);
  document.getElementById('btn-copy-convo').addEventListener('click',copyConvo);
  document.getElementById('btn-add-player').addEventListener('click',function(){
    var nom=document.getElementById('new-nom').value.trim();
    var num=parseInt(document.getElementById('new-num').value);
    var poste=document.getElementById('new-poste').value;
    var statut=document.getElementById('new-statut').value;
    if(!nom||!num){toast('⚠️ Remplis le nom et le numéro');return;}
    players.push({id:Date.now(),nom:nom,num:num,poste:poste,statut:statut,buts:0,passes:0,jaunes:0,rouges:0,minutes:0});
    save('astrw_players',players);
    document.getElementById('new-nom').value='';
    document.getElementById('new-num').value='';
    toast('✅ Joueur ajouté !');renderListe();
  });
  document.getElementById('btn-add-match').addEventListener('click',function(){
    var adv=document.getElementById('cal-adv').value.trim();
    var date=document.getElementById('cal-date').value;
    var heure=document.getElementById('cal-heure').value;
    var type=document.getElementById('cal-type').value;
    var lieu=document.getElementById('cal-lieu').value;
    if(!adv||!date){toast('⚠️ Remplis adversaire et date');return;}
    matchs.push({id:Date.now(),adv:adv,date:date,heure:heure,type:type,lieu:lieu,scoreNous:null,scoreAdv:null,statut:'avenir',buts:[],passes:[],jaunes:[],rouges:[]});
    save('astrw_matchs',matchs);
    document.getElementById('cal-adv').value='';
    toast('✅ Match ajouté !');renderCalListe();
  });
  document.getElementById('btn-add-note').addEventListener('click',function(){
    var txt=document.getElementById('note-input').value.trim();
    if(!txt){toast('⚠️ Écris quelque chose');return;}
    notes.push({id:Date.now(),date:new Date().toISOString().slice(0,10),texte:txt});
    save('astrw_notes',notes);
    document.getElementById('note-input').value='';
    renderNotes();toast('✅ Note enregistrée');
  });
  /* Service worker */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js');
  }
  /* Rendu initial */
  renderHome();
  renderConvo();
  renderButeurs();renderPasseurs();renderMinutes();renderSaisir();
  renderListe();renderCartons();
  renderCalListe();
  renderNotes();
}

window.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
